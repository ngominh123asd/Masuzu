<script>
  // Chặn lỗi runtime từ các Chrome extension chạy trước khi React kịp render
  const originalConsoleError = console.error;
  console.error = function() {
    if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].includes('Unchecked runtime.lastError: Could not establish connection. Receiving end does not exist.')) {
      return;
    }
    originalConsoleError.apply(console, arguments);
  };
</script>
